<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#163b44" />
<meta name="referrer" content="no-referrer" />
<meta name="description" content="A simple directory of voter information resources for Sullivan County, New York." />
<title>Voter Help | Sullivan County</title>
<style>
:root{--ink:#183640;--muted:#597077;--navy:#163b44;--teal:#266f70;--line:#d9e3e2;--bg:#f8f9f6;--paper:#fff;--sand:#ede9de;--focus:#006dab;--radius:15px;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial,sans-serif;font-synthesis:none;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;line-height:1.48}a,button,input{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px}a{color:inherit}button{cursor:pointer}.skip{position:absolute;left:8px;top:-100px;background:white;padding:12px;z-index:5}.skip:focus{top:8px}.wrap{width:min(880px,100%);margin:0 auto;padding-inline:30px}.draft{background:#fff4d9;color:#674c16;text-align:center;padding:10px 16px;font-size:.82rem;font-weight:700;border-bottom:1px solid #e7cea0}.draft[hidden]{display:none}
header{background:var(--navy);color:white}.head{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px}.identity{display:flex;align-items:center;gap:12px;min-width:0}.seal{width:36px;height:36px;border:1px solid #b6d1c8;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:850;letter-spacing:.02em;color:#e7f4ef}.identity .upper{font-size:.85rem;font-weight:750;letter-spacing:.015em}.identity .lower{font-size:.69rem;color:#c7d8d7;letter-spacing:.055em;text-transform:uppercase}.lang{background:transparent;color:white;border:1px solid #93b4b4;padding:10px 16px;border-radius:99px;font-weight:700;font-size:.86rem;white-space:nowrap;min-height:44px}.lang:hover{background:#ffffff16}
main{padding-bottom:60px}.intro{padding:48px 0 28px}.kicker{margin:0 0 11px;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:#1e706c}h1{font-size:clamp(2rem,6vw,3.15rem);letter-spacing:-.055em;line-height:1.11;max-width:740px;margin:0;font-weight:770}.subtitle{margin:16px 0 0;max-width:660px;color:#536a70;font-size:1.06rem;line-height:1.62}.main-title{margin:26px 0 14px;font-size:.84rem;text-transform:uppercase;letter-spacing:.09em;color:#526970;font-weight:800}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.quick a{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 23px;display:block;text-decoration:none;min-height:154px;box-shadow:0 4px 14px #1e3d4210;transition:border-color .15s,box-shadow .15s}.quick a:hover{border-color:#7aa5a1;box-shadow:0 8px 22px #1e3d4218}.toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.symbol{width:38px;height:38px;background:#e6f2ef;color:#205e5e;border-radius:10px;display:grid;place-items:center;font-size:21px;font-weight:750}.arrow{font-size:1.3rem;color:#427c79}.quick strong{display:block;font-size:1.08rem;line-height:1.35;letter-spacing:-.012em}.quick small{display:block;color:#62767a;font-size:.82rem;margin-top:7px}.source{display:block;font-size:.72rem;color:#66807f;margin-top:10px}.source::before{content:'↗  ';color:#43817d}
.other{margin-top:27px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.other summary{padding:19px 24px;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:770;gap:15px;min-height:62px;cursor:pointer}.other summary::-webkit-details-marker{display:none}.other summary .label{display:flex;gap:12px;align-items:center}.other summary .count{font-size:.78rem;color:#627478;font-weight:500}.chevron{font-size:1.1rem;transform:rotate(90deg);color:#387b76;transition:transform .15s}.other[open] .chevron{transform:rotate(-90deg)}.list{padding:0 24px 10px}.list a{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none;min-height:65px}.list a:hover strong{text-decoration:underline;text-underline-offset:3px}.list strong{display:block;font-size:.95rem}.list span.desc{font-size:.8rem;color:#5f7176;display:block;margin-top:3px}.list .go{font-size:1.2rem;color:var(--teal);flex:none}
.searchbar{margin-top:24px;position:relative}.searchbar label{font-size:.85rem;font-weight:720;display:block;margin-bottom:9px}.searchbar input{width:100%;border:1px solid #bacfcd;border-radius:11px;background:white;padding:13px 18px;min-height:49px;color:var(--ink)}.none{margin:18px 0;color:var(--muted)}.none[hidden]{display:none}.staff{margin-top:34px;background:#e9efeb;border:1px solid #d8e3de;border-radius:var(--radius);padding:24px;display:flex;align-items:flex-start;gap:20px}.staffmark{width:40px;height:40px;flex:none;display:grid;place-items:center;color:white;background:var(--teal);border-radius:10px;font-size:20px}.staff h2{font-size:1.1rem;margin:0 0 6px;letter-spacing:-.016em}.staff p{font-size:.93rem;color:#485e65;margin:0 0 9px}.contact{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.contact a{font-weight:780;color:#195e60;text-decoration-thickness:1px;text-underline-offset:3px}.contact span{font-size:.81rem;color:#51696a}.fine{font-size:.76rem;line-height:1.65;color:#677b7c;margin-top:21px}footer{border-top:1px solid #d8e1df;color:#687c80;padding:25px 10px 32px;text-align:center;font-size:.78rem;background:#f1f4f0}.footerlink{color:var(--teal);text-decoration:underline;text-underline-offset:2px}.invisible{display:none!important}
@media(max-width:620px){.wrap{padding-inline:20px}.head{height:73px}.intro{padding:37px 0 15px}h1{font-size:2.27rem}.subtitle{font-size:.99rem}.quick{grid-template-columns:1fr;gap:10px}.quick a{min-height:0;padding:17px 20px}.toprow{margin-bottom:8px}.staff{padding:20px;gap:12px}.list{padding-inline:19px}.other summary{padding:17px 19px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to voter resources</a>
<div class="draft" id="draft">DRAFT FOR REVIEW • Not an official county publication</div>
<header><div class="wrap head"><div class="identity"><div class="seal" aria-hidden="true">SC</div><div><div class="upper">Sullivan County</div><div class="lower">Voter help • New York</div></div></div><button type="button" id="language" class="lang" aria-label="Switch language">Español</button></div></header>
<main class="wrap" id="main"><section class="intro" aria-labelledby="title"><p class="kicker" id="kicker">Here to help</p><h1 id="title">What can we help you with?</h1><p class="subtitle" id="intro"></p></section>
<h2 class="main-title" id="popularTitle">Common requests</h2><div class="quick" id="quick"></div>
<details class="other" id="more"><summary><span class="label"><span id="moreTitle">More voter services</span> <span id="moreCount" class="count"></span></span><span class="chevron" aria-hidden="true">›</span></summary><div class="list" id="otherLinks"></div></details>
<div class="searchbar"><label for="search" id="searchLabel">Looking for something else?</label><input id="search" type="search" autocomplete="off" placeholder="Search resources" /></div>
<p id="none" class="none" role="status" hidden></p>
<aside class="staff"><span class="staffmark" aria-hidden="true">?</span><div><h2 id="staffTitle"></h2><p id="staffText"></p><div class="contact"><a id="phone"></a><span id="address"></span></div></div></aside>
<p class="fine" id="privacy"></p>
</main><footer><span id="footer"></span> · <a class="footerlink" href="https://www.sullivanny.gov/Departments/Elections" target="_blank" rel="noopener noreferrer" id="countyLink">County elections website ↗</a></footer>
<script src="config.js"></script>
<script>
(()=>{'use strict';const cfg=window.VOTER_HUB_CONFIG;const $=id=>document.getElementById(id);
if(!cfg||!Array.isArray(cfg.links)){document.querySelector('#intro').textContent='Resources are temporarily unavailable. Please ask a staff member for assistance.';return;}
const i18n={en:{kicker:'HERE TO HELP',popular:'Common requests',more:'More voter services',searchLabel:'Looking for something else?',search:'Search resources',no:'No matching resources. Please ask a staff member.',staff:'Need a hand?',privacy:'This page is a directory of public resources. It does not collect personal information, register voters or accept ballots. Always check the linked official website for current rules, deadlines and locations.',footer:'Helpful public links, not an application form',county:'County elections website ↗',draft:'DRAFT FOR REVIEW • Not an official county publication',call:'Call'},es:{kicker:'ESTAMOS PARA AYUDAR',popular:'Trámites frecuentes',more:'Más servicios electorales',searchLabel:'¿Busca algo más?',search:'Buscar recursos',no:'No encontramos ese recurso. Consulte al personal.',staff:'¿Necesita ayuda?',privacy:'Esta página es un directorio de recursos públicos. No recopila datos personales, no inscribe votantes ni recibe boletas. Consulte los sitios oficiales enlazados para verificar las normas, fechas y lugares vigentes.',footer:'Enlaces informativos; no es un formulario',county:'Sitio web electoral del condado ↗',draft:'BORRADOR EN REVISIÓN • No es una publicación oficial del condado',call:'Llamar'}};
let lang='en';const preferred=[1,2,0,5];const selected=new Set(preferred);const entries=cfg.links.map((x,i)=>({...x,id:i}));
const localized=v=>typeof v==='string'?v:(v&&v[lang])||(v&&v.en)||'';
function destination(url){try{const u=new URL(url);return u.protocol==='https:'?u:null}catch{return null}}
function makeItem(item,featured){const u=destination(item.url);if(!u)return null;const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',localized(item.title)+' — opens '+u.hostname);const title=document.createElement(featured?'strong':'strong');title.textContent=localized(item.title);
if(featured){const top=document.createElement('div');top.className='toprow';const ico=document.createElement('span');ico.className='symbol';ico.textContent=item.icon||'↗';ico.setAttribute('aria-hidden','true');const arr=document.createElement('span');arr.className='arrow';arr.textContent='↗';arr.setAttribute('aria-hidden','true');top.append(ico,arr);const source=document.createElement('span');source.className='source';source.textContent=u.hostname;a.append(top,title,source)}
else{const inner=document.createElement('div');const desc=document.createElement('span');desc.className='desc';desc.textContent=localized(item.description);const arrow=document.createElement('span');arrow.className='go';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');inner.append(title,desc);a.append(inner,arrow)}return a;}
function render(){document.documentElement.lang=lang;const t=i18n[lang];$('kicker').textContent=t.kicker;$('title').textContent=localized(cfg.headline);$('intro').textContent=localized(cfg.intro);$('popularTitle').textContent=t.popular;$('moreTitle').textContent=t.more;$('searchLabel').textContent=t.searchLabel;$('search').placeholder=t.search;$('none').textContent=t.no;$('staffTitle').textContent=t.staff;$('staffText').textContent=localized(cfg.desk);$('privacy').textContent=t.privacy;$('footer').textContent=t.footer;$('countyLink').textContent=t.county;$('language').textContent=lang==='en'?'Español':'English';$('draft').textContent=t.draft;$('draft').hidden=cfg.reviewed===true;
const digits=(cfg.phone||'').replace(/[^+\d]/g,'');$('phone').textContent=t.call+' '+(cfg.phone||'');if(digits){$('phone').href='tel:'+digits;$('phone').hidden=false}else $('phone').hidden=true;$('address').textContent=cfg.address||'';
const q=$('search').value.toLocaleLowerCase(lang).trim();const found=entries.filter(item=>!q||[localized(item.title),localized(item.description)].join(' ').toLocaleLowerCase(lang).includes(q));const quick=found.filter(item=>selected.has(item.id)).sort((a,b)=>preferred.indexOf(a.id)-preferred.indexOf(b.id));const other=found.filter(item=>!selected.has(item.id));$('quick').replaceChildren(...quick.map(x=>makeItem(x,true)).filter(Boolean));$('otherLinks').replaceChildren(...other.map(x=>makeItem(x,false)).filter(Boolean));$('moreCount').textContent='('+other.length+')';$('more').hidden=other.length===0;$('more').open=Boolean(q);$('popularTitle').hidden=quick.length===0;$('none').hidden=found.length!==0;}
$('language').addEventListener('click',()=>{lang=lang==='en'?'es':'en';render()});$('search').addEventListener('input',render);render();
})();
</script></body></html>
